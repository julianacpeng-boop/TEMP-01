<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMP-01</title><style>body{background:#101923;color:#e4edf5;font:16px system-ui;margin:0}header,main{padding:24px}header{background:#192938}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}section{background:#192938;padding:20px;border:1px solid #354b60;border-radius:12px}input,select,button{font:inherit;padding:8px;margin:6px;background:#24394c;color:white;border:1px solid #58728a;border-radius:5px}output{display:block;background:#08151c;color:#75e9c8;padding:24px;font:32px monospace}label{display:block}small{color:#b5c8d9}svg{width:100%}</style><header><h1>TEMP-01 | Laboratório virtual</h1><small>Modelo funcional paramétrico • Não validado para calibração clínica</small></header><main><section><h2>Painel frontal</h2><output id="oled">DESLIGADO</output><label><input id="power" type="checkbox"> Alimentação</label><label>Seletora <select id="temp"><option>36</option><option>38</option><option>40</option><option>42</option></select> °C</label><label>Bateria (V)<input id="bat" type="number" min="0" max="12" step=".1" value="9"></label><svg viewBox="0 0 300 110"><g fill="none" stroke="#75e9c8" stroke-width="2"><rect x="10" y="10" width="100" height="40"/><rect x="190" y="10" width="100" height="40"/><path d="M110 30H190 M30 75H110 M190 75H270"/><rect x="110" y="60" width="80" height="30"/></g><g fill="white" font-size="12"><text x="20" y="35">Arduino Nano</text><text x="210" y="35">OLED</text><text x="120" y="79">R equivalente</text><text x="10" y="105">Saída P10 isolada — diagrama funcional</text></g></svg></section><section><h2>Ohmímetro virtual</h2><output id="meter">— Ω</output><p>Informe as resistências equivalentes medidas ou calculadas no circuito original.</p><div id="values"></div><label>Tolerância aplicada (%) <input id="tol" type="number" value="0" min="-100" max="100" step=".1"></label><label>Falha <select id="fault"><option value="normal">Normal</option><option value="open">Circuito aberto</option><option value="short">Curto</option></select></label><button id="report">Gerar relatório CSV</button></section></main><script>const $=id=>document.getElementById(id),temps=[36,38,40,42];for(const t of temps){$('values').insertAdjacentHTML('beforeend','<label>'+t+' °C (Ω) <input type="number" min="0" step="any" id="r'+t+'" placeholder="Não informado"></label>')}function resistance(t){if($('fault').value==='open')return 'OL';if($('fault').value==='short')return '0';const v=$('r'+t).value;if(v===''||Number(v)<0)return 'Não informado';return (Number(v)*(1+Number($('tol').value)/100)).toFixed(3)}function refresh(){$('oled').textContent=$('power').checked?($('bat').value>0?$('temp').value+' °C (lógico)':'SEM BATERIA'):'DESLIGADO';$('meter').textContent=resistance($('temp').value)+' Ω'}document.addEventListener('input',refresh);document.addEventListener('change',refresh);$('report').onclick=()=>{const csv='Temperatura C;Resistencia simulada ohm;Falha\n'+temps.map(t=>[t,resistance(t),$('fault').value].join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='TEMP-01-testes.csv';a.click();URL.revokeObjectURL(a.href)};refresh();</script></html>
